name: Android emulator verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator.yml'
      - 'gradle/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install emulator and SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n cinematic-ci -k "system-images;android-35;google_apis;x86_64"
      - name: Run real camera UI and GPU integration tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -avd cinematic-ci -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated > emulator.log 2>&1 &
          trap 'adb logcat -d > emulator-logcat.txt || true; adb emu kill || true' EXIT
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-verification
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            emulator-logcat.txt
          if-no-files-found: warn
